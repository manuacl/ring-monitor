name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same branch/PR — only the latest commit needs
# to be green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── File-size gate ──────────────────────────────────────────────────
  #
  # Source + test files capped at 500 lines. If a file outgrows this, the
  # fix is to split (extract logic to a .js module, pull a sub-component
  # into its own .qml file) — not to raise the cap. See CLAUDE.md
  # "Working rules".
  file-size:
    name: File-size gate (≤500 lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check file sizes
        run: |
          MAX_LINES=500
          status=0
          shopt -s nullglob
          for f in contents/ui/*.qml contents/ui/*.js \
                   contents/ui/core/*.qml contents/ui/core/*.js \
                   contents/ui/platforms/plasma/*.qml \
                   tests/*.test.mjs tests/qml/*.qml; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt "$MAX_LINES" ]; then
              echo "::error file=$f::file is $lines lines (> $MAX_LINES). Split it — extract logic to a .js module or pull a sub-component into its own .qml file."
              status=1
            fi
          done
          exit $status

  # ── Pure Node logic tests ────────────────────────────────────────────
  node-tests:
    name: Node tests (logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Run tests
        run: node --test tests/*.test.mjs

  # ── QML lint, format check, runtime tests ────────────────────────────
  #
  # Runs in a Fedora container so the Qt 6 / Kirigami 6 tooling matches the
  # dev environment (Bazzite = Fedora atomic). qmltestrunner needs a display
  # — QT_QPA_PLATFORM=offscreen lets it run headlessly.
  qml-checks:
    name: QML lint + format + tests
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt 6 + Kirigami + headless deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            qt6-qtdeclarative-devel \
            qt6-qtbase-gui \
            kf6-kirigami \
            kf6-kdeclarative \
            mesa-dri-drivers \
            diffutils \
            git
          # kf6-kdeclarative ships org.kde.kquickcontrols (ColorButton),
          # which platforms/plasma/ColorPicker.qml wraps. QML directory
          # imports resolve transitively at compile time, so any test
          # that instantiates AppearanceBody (or anything else under
          # core/ that uses Platform.*) needs the module installed —
          # otherwise compile fails with "module not installed".

      - name: qmllint (source + tests)
        run: qmllint-qt6 contents/ui/*.qml contents/ui/core/*.qml contents/ui/platforms/plasma/*.qml tests/qml/*.qml

      - name: qmlformat is a no-op (committed files match qmlformat output)
        run: |
          for f in contents/ui/*.qml contents/ui/core/*.qml contents/ui/platforms/plasma/*.qml; do
            if ! diff -q "$f" <(qmlformat-qt6 "$f") > /dev/null; then
              echo "::error file=$f::qmlformat would reformat this file — run qmlformat-qt6 --inplace locally and recommit"
              echo "--- diff ---"
              diff -u "$f" <(qmlformat-qt6 "$f") || true
              exit 1
            fi
          done

      - name: QML tests (qmltestrunner, headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: qmltestrunner-qt6 -input tests/qml
