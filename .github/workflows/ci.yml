name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same branch/PR — only the latest commit needs
# to be green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Change detection ─────────────────────────────────────────────────
  #
  # Each downstream job runs only when its area of the tree changed, so a
  # docs-only PR (README, docs/**, **/CLAUDE.md, .claude/**) skips the whole
  # matrix and a plasma-adapter-only change doesn't rebuild the standalone
  # C++ binary. `main` is unprotected (no required status checks), so a
  # skipped job never blocks a merge — the filter is pure cost-saving.
  #
  # Filter notes:
  #   - `src`  feeds the file-size cap, whose glob is contents/ui/** +
  #            standalone/*.cpp + tests/**.
  #   - `js`   feeds the Node logic tests. Keyed on contents/ui/** (NOT just
  #            *.js) because several Node tests are text-level guards that
  #            read .qml source (e.g. disk-partitions.test.mjs asserts on
  #            DiskPartitions.qml) — a .qml edit can legitimately fail them.
  #   - `qml`  feeds qmllint/qmlformat/qmltestrunner over every .qml.
  #   - `standalone` feeds the C++ build, which bundles only core/ +
  #            platforms/standalone/ QML (plus the C++, CMakeLists, and
  #            metadata.json the build parses the version from) — so a
  #            platforms/plasma/ change does not trigger it.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      js: ${{ steps.filter.outputs.js }}
      qml: ${{ steps.filter.outputs.qml }}
      standalone: ${{ steps.filter.outputs.standalone }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'contents/ui/**'
              - 'standalone/**/*.cpp'
              - 'tests/**'
            js:
              - 'contents/ui/**'
              - 'tests/*.test.mjs'
            qml:
              - 'contents/ui/**'
              - 'tests/qml/**'
            standalone:
              - 'standalone/**'
              - 'CMakeLists.txt'
              - 'metadata.json'
              - 'contents/ui/core/**'
              - 'contents/ui/platforms/standalone/**'
            changelog:
              - 'CHANGELOG.md'

  # ── CHANGELOG entry required on every PR ─────────────────────────────
  #
  # Policy (2026-05-30): every PR touches CHANGELOG.md — a `### Technical`
  # entry under `## [Unreleased]` for a code change (plus the user-facing
  # summary when the PR is bump-labelled), or a single `### Other` one-liner
  # for a docs/CI-only PR. This is the CI mirror of finish-branch check 4h.
  # Pull-request only: a push to main is post-merge (the entry already
  # landed), and the paths-filter needs a base ref to diff against anyway.
  changelog:
    name: CHANGELOG entry present
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a CHANGELOG.md entry
        if: ${{ needs.changes.outputs.changelog != 'true' }}
        run: |
          echo "::error file=CHANGELOG.md::Every PR must touch CHANGELOG.md — add a '### Technical' entry under '## [Unreleased]' (a code change), or a single '### Other' line (a docs/CI-only PR)."
          exit 1

  # ── File-size gate ──────────────────────────────────────────────────
  #
  # Source + test files capped at 500 lines. If a file outgrows this, the
  # fix is to split (extract logic to a .js module, pull a sub-component
  # into its own .qml file) — not to raise the cap. See CLAUDE.md
  # "Working rules".
  file-size:
    name: File-size gate (≤500 lines)
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check file sizes
        run: |
          MAX_LINES=500
          status=0
          shopt -s nullglob
          for f in contents/ui/*.qml contents/ui/*.js \
                   contents/ui/core/*.qml contents/ui/core/*.js \
                   contents/ui/platforms/plasma/*.qml contents/ui/platforms/plasma/*.js \
                   contents/ui/platforms/standalone/*.qml contents/ui/platforms/standalone/*.js \
                   standalone/*.cpp \
                   tests/*.test.mjs tests/qml/*.qml; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt "$MAX_LINES" ]; then
              echo "::error file=$f::file is $lines lines (> $MAX_LINES). Split it — extract logic to a .js module or pull a sub-component into its own .qml file."
              status=1
            fi
          done
          exit $status

  # ── Pure Node logic tests ────────────────────────────────────────────
  node-tests:
    name: Node tests (logic)
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Run tests
        run: node --test tests/*.test.mjs

  # ── QML lint, format check, runtime tests ────────────────────────────
  #
  # Runs in a Fedora container so the Qt 6 / Kirigami 6 tooling matches the
  # dev environment (Bazzite = Fedora atomic). qmltestrunner needs a display
  # — QT_QPA_PLATFORM=offscreen lets it run headlessly.
  qml-checks:
    name: QML lint + format + tests
    needs: changes
    if: ${{ needs.changes.outputs.qml == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt 6 + Kirigami + headless deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            qt6-qtdeclarative-devel \
            qt6-qtbase-gui \
            kf6-kirigami \
            kf6-kdeclarative \
            mesa-dri-drivers \
            diffutils \
            git
          # kf6-kdeclarative ships org.kde.kquickcontrols (ColorButton),
          # which platforms/plasma/ColorPicker.qml wraps. QML directory
          # imports resolve transitively at compile time, so any test
          # that instantiates AppearanceBody (or anything else under
          # core/ that uses Platform.*) needs the module installed —
          # otherwise compile fails with "module not installed".

      - name: qmllint (source + tests)
        run: qmllint-qt6 contents/ui/*.qml contents/ui/core/*.qml contents/ui/platforms/plasma/*.qml contents/ui/platforms/standalone/*.qml tests/qml/*.qml

      - name: qmlformat is a no-op (committed files match qmlformat output)
        run: |
          for f in contents/ui/*.qml contents/ui/core/*.qml contents/ui/platforms/plasma/*.qml contents/ui/platforms/standalone/*.qml; do
            if ! diff -q "$f" <(qmlformat-qt6 "$f") > /dev/null; then
              echo "::error file=$f::qmlformat would reformat this file — run qmlformat-qt6 --inplace locally and recommit"
              echo "--- diff ---"
              diff -u "$f" <(qmlformat-qt6 "$f") || true
              exit 1
            fi
          done

      - name: QML tests (qmltestrunner, headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: qmltestrunner-qt6 -input tests/qml

  # ── Standalone C++ build ────────────────────────────────────────────
  #
  # Compiles `ring-monitor-standalone` end-to-end so a broken
  # `CMakeLists.txt`, a missing system header (xcb-devel,
  # qt6-qtdeclarative-devel), or a regression in `standalone/*.cpp`
  # gets caught in CI instead of waiting for a contributor's local
  # build. Mirrors `docs/development.md` § "Standalone build".
  #
  # No headless smoke test here — that needs a Wayland or X session
  # the runner can't provide, and the QML side is already exercised
  # by `qml-checks` above. This job is purely "does the C++ link".
  standalone-build:
    name: Standalone C++ build
    needs: changes
    if: ${{ needs.changes.outputs.standalone == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - uses: actions/checkout@v6

      - name: Install build toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake \
            gcc-c++ \
            make \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            kf6-kirigami \
            libxcb-devel

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build
