name: Release

# Triggers on push of a v* tag (created by .github/workflows/version.yml
# when a PR with a bump:* label is merged). Builds the .plasmoid
# package, smoke-tests its structure, and publishes a GitHub Release
# with auto-generated notes from the merged PR titles since the
# previous tag.
#
# The .plasmoid file is just a zip of the runtime tree:
#   metadata.json + contents/ + LICENSE
# Everything else (.claude/, .github/, tests/, docs/, README.md,
# CLAUDE.md, .githooks/) is excluded — those are dev artifacts.

on:
  push:
    tags: ['v*']
  # Manual re-run for a specific tag — useful when version.yml ran but
  # release.yml wasn't on main yet, or to retry a failed release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # On workflow_dispatch, check out the requested tag explicitly
      # so the rest of the workflow reads its metadata.json.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve tag name
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "name=$TAG" >> $GITHUB_OUTPUT

      - name: Read version from tag
        id: meta
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          # Strip the leading v AND the platform-scope suffix (issue #89:
          # tags are vX.Y.Z, vX.Y.Z-p, or vX.Y.Z-s). metadata.json holds
          # the clean X.Y.Z, so the suffix must come off here — otherwise
          # the "version matches tag" check below fails the release, and
          # the .plasmoid name / title / KDE Store version would carry it.
          VERSION="${TAG_NAME#v}"
          VERSION="${VERSION%-p}"
          VERSION="${VERSION%-s}"
          PLUGIN_ID=$(jq -r .KPlugin.Id metadata.json)
          NAME=$(jq -r .KPlugin.Name metadata.json)
          ARTIFACT="${PLUGIN_ID}-${VERSION}.plasmoid"
          echo "version=$VERSION"       >> $GITHUB_OUTPUT
          echo "plugin_id=$PLUGIN_ID"   >> $GITHUB_OUTPUT
          echo "name=$NAME"             >> $GITHUB_OUTPUT
          echo "artifact=$ARTIFACT"     >> $GITHUB_OUTPUT

      - name: Verify metadata.json version matches tag
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          META_VERSION=$(jq -r .KPlugin.Version metadata.json)
          if [ "$META_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::metadata.json version ($META_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build .plasmoid
        env:
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: |
          # The .plasmoid ships the Plasma widget only. Exclude:
          #  - contents/ui/platforms/standalone/ — the standalone-build
          #    QML adapters the Plasma host never loads (main.qml imports
          #    platforms/plasma + core). Shipping them is dead weight and
          #    leaks the standalone implementation to KDE Store users.
          #  - per-layer CLAUDE.md — dev docs nested under contents/ that
          #    would otherwise ride along (the root-level dev-artifact
          #    check in the smoke-test below doesn't catch nested ones).
          zip -r "$ARTIFACT" \
              metadata.json \
              contents \
              LICENSE \
              -x 'contents/ui/platforms/standalone/*' \
              -x '*/CLAUDE.md'
          ls -lh "$ARTIFACT"

      - name: Smoke-test the package structure
        env:
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
          PLUGIN_ID: ${{ steps.meta.outputs.plugin_id }}
        run: |
          # The .plasmoid must be loadable by kpackagetool6, which means:
          # - metadata.json at the root
          # - contents/ui/main.qml present
          # - KPlugin.Id matches what we expect
          tmpdir=$(mktemp -d)
          unzip -q "$ARTIFACT" -d "$tmpdir"

          test -f "$tmpdir/metadata.json"        || { echo "::error::metadata.json missing"; exit 1; }
          test -f "$tmpdir/contents/ui/main.qml" || { echo "::error::contents/ui/main.qml missing"; exit 1; }
          test -f "$tmpdir/LICENSE"              || { echo "::error::LICENSE missing"; exit 1; }

          actual_id=$(jq -r .KPlugin.Id "$tmpdir/metadata.json")
          if [ "$actual_id" != "$PLUGIN_ID" ]; then
            echo "::error::KPlugin.Id mismatch: $actual_id != $PLUGIN_ID"
            exit 1
          fi

          # Catch accidental inclusions of dev artifacts (root-level).
          for forbidden in .git .github .claude tests docs .githooks; do
            if [ -e "$tmpdir/$forbidden" ]; then
              echo "::error::dev artifact leaked into package: $forbidden"
              exit 1
            fi
          done

          # The package is the Plasma widget only — the standalone-build
          # QML adapters and the per-layer CLAUDE.md dev docs must NOT
          # ride along (excluded in the zip step above; these assertions
          # stop a future zip-step change from silently re-leaking them).
          if [ -d "$tmpdir/contents/ui/platforms/standalone" ]; then
            echo "::error::standalone adapter dir leaked into the Plasma package"
            exit 1
          fi
          leaked_md=$(find "$tmpdir" -name CLAUDE.md)
          if [ -n "$leaked_md" ]; then
            echo "::error::CLAUDE.md dev doc leaked into the package:"
            echo "$leaked_md"
            exit 1
          fi

          echo "Package OK ($(du -h "$ARTIFACT" | cut -f1))"

      - name: Compose release body
        # Lead with the user-facing CHANGELOG summary for this version (the
        # Added/Changed/Fixed block, above the per-PR Technical detail), then
        # the auto-generated "What's Changed" PR list. The KDE Store upload
        # stays manual (the opendesktop.org OCS API is read-only) — see
        # docs/releasing.md § KDE Store — but is no longer echoed into the body.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Auto-generated PR list. Relabel GitHub's "## What's Changed" header
          # to "## Pull requests" — it's ambiguous sitting under the curated
          # "What's new" summary, which is the real "what changed".
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$TAG_NAME" \
            --jq .body | sed "s/^## What's Changed$/## Pull requests/" > /tmp/auto-notes.md

          # Extract the user-facing block for $VERSION from CHANGELOG.md:
          # everything under `## [$VERSION]` up to (not including) the
          # `### Technical` / `### Other` detail or the next version header.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { inver = 1; next }
            inver && /^## \[/ { exit }
            inver && /^### (Technical|Other)/ { exit }
            inver { print }
          ' CHANGELOG.md > /tmp/user-notes.md

          {
            # Lead with the curated "What's new" summary when it has content.
            if grep -q '[^[:space:]]' /tmp/user-notes.md; then
              echo "## What's new"
              cat /tmp/user-notes.md
              echo ""
            fi
            cat /tmp/auto-notes.md
          } > /tmp/release-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          # Do NOT pass --prerelease here. A scope-suffixed tag (vX.Y.Z-p /
          # -s, issue #89) is a SemVer pre-release string, but the release
          # must stay prerelease:false: the in-widget update check
          # (core/UpdateCheck.js pickRelevantRelease) skips releases flagged
          # prerelease, so marking these would silently suppress every
          # scoped notification. gh leaves the flag false by default.
          # Idempotent for the workflow_dispatch retry path: on a tag-push the
          # release is absent → create it; on a manual re-run for a tag whose
          # release already exists (e.g. the original run failed in the appimage
          # job) `gh release create` would error, so re-upload the .plasmoid with
          # --clobber instead and let the appimage job re-attach below.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ARTIFACT" --clobber
          else
            gh release create "$TAG_NAME" \
              "$ARTIFACT" \
              --title "$NAME v$VERSION" \
              --notes-file /tmp/release-body.md
          fi

  # Build the standalone AppImage and attach it to the SAME Release the
  # job above created. A separate job (needs: release) keeps the fast
  # .plasmoid publish decoupled from the slower Qt + linuxdeploy
  # toolchain. ubuntu-22.04 (glibc 2.35) keeps the broad-portability glibc
  # floor; Qt 6.8 from aqtinstall (22.04 is a Qt 6.8 reference platform, so the
  # glibc floor is unchanged) because the process-tooltip needs `popupType`
  # (Qt 6.8+) to escape the tiny standalone window as a Window popup. The
  # CMakeLists floor stays 6.6 and the widget loads there via a runtime guard
  # (in-scene fallback) — ci.yml's appimage smoke-test pins that 6.6 path.
  appimage:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make pkg-config git \
            libxcb1-dev libgl1-mesa-dev libfontconfig1 libfuse2 \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          # Qt >= 6.7 renamed the linux desktop arch gcc_64 → linux_gcc_64
          # (disambiguating from linux_arm64). aqt rejects gcc_64 for 6.8.3
          # with "packages [qt_base, …] not found". ci.yml's smoke-test stays
          # on the 6.6 floor, where the arch is still gcc_64.
          arch: linux_gcc_64
          # qtshadertools: required by the Kirigami 6 build (find_package
          # Qt6 ShaderTools), not in the aqt base set. Qt6WaylandClient +
          # the wayland platform plugins are already in the base linux_gcc_64
          # package — there is no separate `qtwayland` aqt module (only
          # qtwaylandcompositor, the server side, which we don't use).
          modules: qtimageformats qtshadertools

      # Bundle Kirigami 6 (core/ imports org.kde.kirigami) — same as the
      # ci.yml appimage job. See scripts/build-kirigami6.sh.
      - name: Build + install Kirigami 6
        run: scripts/build-kirigami6.sh

      # layer-shell-qt for the native wlr-layer-shell path (PR C2) — same
      # as ci.yml; reuses the ECM the Kirigami step installed.
      - name: Build + install layer-shell-qt
        run: scripts/build-layer-shell-qt.sh

      - name: Build the AppImage
        run: scripts/build-appimage.sh

      # Gate the release on the SAME offscreen smoke-test the PR runs, so
      # a broken AppImage (e.g. an unbundled QML module) can never be
      # published to a tag — release.yml has no other guard against it.
      - name: Offscreen smoke-test
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 4 ./Ring_Monitor-*-x86_64.AppImage
          code=$?
          if [ "$code" -ne 124 ]; then
            echo "::error::AppImage smoke-test failed (exit $code; expected 124) — refusing to publish"
            exit 1
          fi
          echo "Smoke-test OK (exit 124 = QML root loaded)"

      # Same native-Wayland bundling assertion as the PR CI (shared
      # script) — never publish a tag whose AppImage dropped the Wayland path.
      - name: Verify native-Wayland bundling
        run: scripts/verify-wayland-bundling.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          # --clobber makes a workflow_dispatch re-run idempotent.
          gh release upload "$TAG_NAME" Ring_Monitor-*-x86_64.AppImage --clobber
