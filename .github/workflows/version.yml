name: Bump version

# Triggers on push to main (= a PR has just been merged). Reads the
# merged PR's bump:<level> label, bumps metadata.json's KPlugin.Version
# accordingly, commits the change and creates the matching git tag.
#
# No label = no bump: the workflow exits cleanly without touching
# anything.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # BUMP_TOKEN is a PAT (classic, scope=repo) owned by an admin.
      # Required because the bump commit + tag push to main bypass the
      # repository ruleset via the admin actor — the default
      # GITHUB_TOKEN runs as github-actions[bot], which has no bypass
      # and would be rejected by branch protection.
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.BUMP_TOKEN }}
          fetch-depth: 0

      - name: Skip if HEAD already tagged
        id: check
        run: |
          if git describe --exact-match HEAD 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Find merged PR
        if: steps.check.outputs.skip == 'false'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PR=$(gh pr list --state merged --base main --limit 5 --json number,mergeCommit \
            --jq ".[] | select(.mergeCommit.oid == \"$COMMIT_SHA\") | .number")
          echo "number=$PR" >> $GITHUB_OUTPUT

      - name: Resolve bump type from PR label
        if: steps.check.outputs.skip == 'false'
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          TYPE=none
          if [ -n "$PR_NUMBER" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | join(",")')
            if   echo "$LABELS" | grep -q "bump:major"; then TYPE=major
            elif echo "$LABELS" | grep -q "bump:minor"; then TYPE=minor
            elif echo "$LABELS" | grep -q "bump:patch"; then TYPE=patch
            fi
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Bump type: $TYPE (PR #${PR_NUMBER:-none})"

      - name: Compute new version
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          CURRENT=$(jq -r .KPlugin.Version metadata.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping $CURRENT → $NEW"

      - name: Update metadata.json
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          jq --indent 4 ".KPlugin.Version = \"$NEW_VERSION\"" metadata.json > metadata.json.tmp
          mv metadata.json.tmp metadata.json
          # Strip jq's trailing newline → match the file's original style
          # (already 4-space indented, ends without a trailing blank line).

      # Platform scope of this release (issue #89): suffix the tag with
      # -p / -s / nothing so the in-widget update check notifies only the
      # platform(s) the release actually changed. metadata.json stays a
      # clean X.Y.Z — the suffix is on the tag/release name ONLY.
      - name: Infer release scope
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        id: scope
        run: |
          # Cumulative diff since the previous tag: a release bundles the
          # labelled PR plus every bump:none PR merged since the last tag.
          # HEAD is the merge commit — the version-bump commit isn't made
          # yet — so metadata.json is not in the range. First-ever release
          # (no previous tag) gets no suffix → notify both platforms.
          # --match 'v[0-9]*' pins this to release tags, so a stray
          # non-release tag can't become the diff base and skew the scope.
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            SUFFIX=$(git diff --name-only "$LAST_TAG"..HEAD | scripts/infer-release-scope.sh)
          else
            SUFFIX=""
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "Release scope suffix: '${SUFFIX:-<none>}' (since ${LAST_TAG:-<no previous tag>})"

      - name: Configure git
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, push
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          SCOPE_SUFFIX: ${{ steps.scope.outputs.suffix }}
        run: |
          # metadata.json keeps the clean X.Y.Z; the tag carries the scope
          # suffix (release.yml strips it back off to match metadata).
          TAG="v${NEW_VERSION}${SCOPE_SUFFIX}"
          git add metadata.json
          git commit -m "chore: bump version to $NEW_VERSION ($BUMP_TYPE)"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main --no-verify
          git push origin "$TAG" --no-verify
