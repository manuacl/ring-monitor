[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
# UnqualifiedAccess fires on Plasma-provided `i18n(...)` and Kirigami attached
# properties (`Kirigami.FormData.label: ...`) — both false positives the linter
# can't statically resolve. Set to `info` so they're still listed but don't
# count as warnings. Real cross-Component scope leaks are caught by
# `pragma ComponentBehavior: Bound` at the file level.
UnqualifiedAccess=info
